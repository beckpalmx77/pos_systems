<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS Professional</title>

  <link rel="icon" href="img/favicon/favicon.ico" type="image/x-icon">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Sarabun', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 h-screen overflow-hidden">

<div id="loginModal" class="fixed inset-0 bg-black bg-opacity-80 z-50 flex justify-center items-center backdrop-blur-sm">
  <div class="bg-white p-8 rounded-xl shadow-2xl w-96">
    <div class="text-center mb-6">
      <div class="bg-blue-600 text-white w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl shadow-lg">
        <i class="fas fa-cash-register"></i>
      </div>
      <h2 class="text-2xl font-bold text-gray-800">เข้าสู่ระบบ POS</h2>
      <p class="text-xs text-gray-400 mt-2">User: admin / Pass: 1234</p>
    </div>
    <div class="space-y-4">
      <input type="text" id="username" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Username">
      <input type="password" id="password" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Password">
      <button onclick="login()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-lg transition">เข้าสู่ระบบ</button>
    </div>
  </div>
</div>

<div id="appWrapper" class="hidden flex h-screen">
  <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-2xl z-20">
    <div class="h-20 flex items-center justify-center border-b border-slate-700 bg-slate-900">
      <h1 class="text-2xl font-bold tracking-widest text-blue-400">POS<span class="text-white">PRO</span></h1>
    </div>
    <ul id="menuList" class="flex-1 overflow-y-auto py-4 px-2 space-y-1"></ul>
    <div class="p-4 border-t border-slate-700">
      <button onclick="location.reload()" class="w-full bg-red-600 hover:bg-red-700 text-white py-2 rounded-lg transition flex items-center justify-center gap-2">
        <i class="fas fa-sign-out-alt"></i> ออกจากระบบ
      </button>
    </div>
  </aside>

  <main class="flex-1 flex flex-col min-w-0 bg-gray-100">
    <header class="bg-white h-16 flex items-center justify-between px-6 shadow-sm z-10">
      <div class="text-gray-500 font-medium"><i class="far fa-clock text-blue-500 mr-2"></i> <span id="systemTime">...</span></div>
      <div class="flex items-center gap-3">
        <div class="text-right leading-tight">
          <p class="text-xs text-gray-400">พนักงานขาย</p>
          <p id="currentUser" class="text-sm font-bold text-gray-800">...</p>
        </div>
        <div class="w-10 h-10 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center"><i class="fas fa-user"></i></div>
      </div>
    </header>

    <div class="flex-1 p-4 overflow-hidden flex flex-col">
      <div class="bg-white rounded-xl shadow-sm border border-gray-200 flex-1 flex flex-col overflow-hidden">

        <div class="p-4 bg-blue-50 border-b border-blue-100 flex items-center justify-between">
          <div class="flex items-center gap-3 flex-1">
            <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-blue-500 shadow-sm"><i class="fas fa-users"></i></div>
            <div>
              <p class="text-xs text-gray-500">ลูกค้าสมาชิก (F2)</p>
              <h3 id="memberDisplayName" class="text-lg font-bold text-gray-800">ลูกค้าทั่วไป (Guest)</h3>
            </div>
          </div>
          <div class="flex gap-2">
            <input type="text" id="memberInput" class="px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-48" placeholder="ยิงบัตรสมาชิก / เบอร์โทร">
            <button onclick="findMember()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm shadow"><i class="fas fa-search"></i></button>
            <button onclick="resetMember()" class="bg-gray-300 hover:bg-gray-400 text-gray-700 px-3 py-2 rounded-lg text-sm shadow"><i class="fas fa-times"></i></button>
          </div>
        </div>

        <div class="p-4 bg-gray-50 border-b border-gray-100">
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><i class="fas fa-barcode text-gray-400 text-xl"></i></div>
            <input type="text" id="barcodeInput" class="w-full pl-12 pr-4 py-4 border-2 border-blue-500 rounded-lg text-xl focus:outline-none focus:ring-4 focus:ring-blue-100 transition" placeholder="ยิงบาร์โค้ดสินค้า (F4)" autofocus autocomplete="off">
          </div>
        </div>

        <div class="flex-1 overflow-auto">
          <table class="w-full text-left border-collapse">
            <thead class="bg-gray-100 sticky top-0 shadow-sm z-0">
            <tr>
              <th class="py-3 px-4 font-semibold text-gray-600 text-sm">สินค้า</th>
              <th class="py-3 px-4 font-semibold text-gray-600 text-sm text-right">ราคา</th>
              <th class="py-3 px-4 font-semibold text-gray-600 text-sm text-center">จำนวน</th>
              <th class="py-3 px-4 font-semibold text-gray-600 text-sm text-right">รวม</th>
              <th class="py-3 px-4 font-semibold text-gray-600 text-sm text-center">ลบ</th>
            </tr>
            </thead>
            <tbody id="cartTable" class="divide-y divide-gray-100"></tbody>
          </table>
          <div id="emptyCart" class="flex flex-col items-center justify-center h-40 text-gray-400">
            <i class="fas fa-box-open text-4xl mb-2"></i><p>รอรับรายการสินค้า</p>
          </div>
        </div>

        <div class="p-6 bg-slate-50 border-t border-gray-200">
          <div class="flex justify-between items-end mb-4">
            <div class="text-gray-500">จำนวน: <span id="totalItems" class="font-bold text-gray-800">0</span> ชิ้น</div>
            <div class="text-right">
              <p class="text-xs text-gray-500">ยอดรวมสุทธิ</p>
              <h2 class="text-4xl font-bold text-blue-600">฿<span id="grandTotal">0.00</span></h2>
            </div>
          </div>
          <button onclick="submitOrder()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white text-xl font-bold py-4 rounded-xl shadow-lg transition active:scale-95 flex items-center justify-center gap-2">
            <i class="fas fa-check-circle"></i> ยืนยันการขาย
          </button>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  const API_URL = 'api/basic_api.php';
  let currentUserData = null;
  let cart = [];
  let currentMember = null;

  // --- LOGIN ---
  async function login() {
    const u = document.getElementById('username').value;
    const p = document.getElementById('password').value;
    try {
      const res = await fetch(`${API_URL}?action=login`, {
        method: 'POST', body: JSON.stringify({ username: u, password: p })
      });
      const data = await res.json();
      if (data.success) {
        currentUserData = data.user;
        document.getElementById('loginModal').classList.add('hidden');
        document.getElementById('appWrapper').classList.remove('hidden');
        document.getElementById('currentUser').innerText = currentUserData.fullname;
        loadMenus(currentUserData.role);
        document.getElementById('barcodeInput').focus();
      } else { alert(data.message); }
    } catch (e) { console.error(e); alert('Connection Error: ' + API_URL); }
  }

  // --- MENUS ---
  async function loadMenus(role) {
    const res = await fetch(`${API_URL}?action=get_menus&role=${role}`);
    const menus = await res.json();
    const list = document.getElementById('menuList');
    list.innerHTML = '';
    menus.forEach(m => {
      list.innerHTML += `<li><a href="${m.link}" class="flex items-center px-4 py-3 text-gray-400 hover:bg-slate-800 hover:text-white transition"><span class="w-8 text-center"><i class="fas ${m.icon}"></i></span><span>${m.name}</span></a></li>`;
    });
  }

  // --- MEMBER SYSTEM ---
  async function findMember() {
    const input = document.getElementById('memberInput');
    const keyword = input.value.trim();
    if(!keyword) return;

    try {
      const res = await fetch(`${API_URL}?action=get_member&keyword=${keyword}`);
      const result = await res.json();
      if(result.found) {
        currentMember = result.data;
        const display = document.getElementById('memberDisplayName');
        display.innerHTML = `<i class="fas fa-check-circle"></i> ${currentMember.name} <span class="text-sm font-normal text-gray-600">(แต้ม: ${currentMember.points})</span>`;
        display.classList.add('text-green-600');
        input.value = '';
        document.getElementById('barcodeInput').focus(); // Jump to product
      } else {
        alert('ไม่พบข้อมูลสมาชิก');
        input.value = '';
        input.focus();
      }
    } catch(e) { console.error(e); }
  }

  function resetMember() {
    currentMember = null;
    const display = document.getElementById('memberDisplayName');
    display.innerText = "ลูกค้าทั่วไป (Guest)";
    display.classList.remove('text-green-600');
    document.getElementById('memberInput').value = '';
    document.getElementById('barcodeInput').focus();
  }

  document.getElementById('memberInput').addEventListener('keyup', (e) => {
    if(e.key === 'Enter') findMember();
  });

  // --- PRODUCT & CART ---
  const input = document.getElementById('barcodeInput');
  input.addEventListener('keyup', async (e) => {
    if (e.key === 'Enter' && input.value.trim() !== "") {
      const barcode = input.value.trim();
      const res = await fetch(`${API_URL}?action=get_product&barcode=${barcode}`);
      const result = await res.json();
      if (result.found) { addToCart(result.data); input.value = ''; }
      else { alert('ไม่พบสินค้า!'); input.value = ''; }
    }
  });

  function addToCart(product) {
    const existing = cart.find(i => i.id === product.id);
    if (existing) existing.qty++;
    else cart.push({ ...product, price: parseFloat(product.price), qty: 1 });
    renderCart();
  }

  function renderCart() {
    const tbody = document.getElementById('cartTable');
    const empty = document.getElementById('emptyCart');
    tbody.innerHTML = '';
    let total = 0, qty = 0;
    if (cart.length > 0) empty.classList.add('hidden'); else empty.classList.remove('hidden');

    cart.forEach((item, idx) => {
      const sum = item.price * item.qty;
      total += sum; qty += item.qty;
      tbody.innerHTML += `
        <tr class="hover:bg-blue-50 transition">
            <td class="py-3 px-4 border-b">${item.name}</td>
            <td class="py-3 px-4 border-b text-right">${item.price.toFixed(2)}</td>
            <td class="py-3 px-4 border-b text-center"><span class="bg-gray-200 px-2 py-1 rounded text-sm font-bold">${item.qty}</span></td>
            <td class="py-3 px-4 border-b text-right font-bold text-blue-600">${sum.toFixed(2)}</td>
            <td class="py-3 px-4 border-b text-center"><button onclick="remove(${idx})" class="text-red-400 hover:text-red-600"><i class="fas fa-trash"></i></button></td>
        </tr>`;
    });
    document.getElementById('grandTotal').innerText = total.toLocaleString('th-TH', {minimumFractionDigits: 2});
    document.getElementById('totalItems').innerText = qty;
  }

  function remove(idx) { cart.splice(idx, 1); renderCart(); input.focus(); }

  // --- SUBMIT ORDER ---
  async function submitOrder() {
    if (cart.length === 0) return alert('ไม่มีสินค้า');
    if (!confirm('ยืนยันบันทึกยอดขาย?')) return;

    const payload = {
      cashier: currentUserData.fullname,
      total: parseFloat(document.getElementById('grandTotal').innerText.replace(/,/g,'')),
      items: cart,
      member_id: currentMember ? currentMember.id : null
    };

    try {
      const res = await fetch(`${API_URL}?action=save_order`, {
        method: 'POST', body: JSON.stringify(payload)
      });
      const result = await res.json();
      if (result.success) {
        alert(`✅ บันทึกสำเร็จ!\nเลขที่เอกสาร: ${result.docId}`);
        cart = []; resetMember(); renderCart();
      } else { alert('Error: ' + result.message); }
    } catch(e) { alert('Failed to save order'); }
  }

  // --- UTILS & HOTKEYS ---
  setInterval(() => document.getElementById('systemTime').innerText = new Date().toLocaleString('th-TH'), 1000);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'F2') { e.preventDefault(); document.getElementById('memberInput').focus(); }
    if (e.key === 'F4' || e.key === 'Escape') { e.preventDefault(); document.getElementById('barcodeInput').focus(); }
  });

  document.addEventListener('click', (e) => {
    if (currentUserData && !e.target.closest('button') && e.target.tagName !== 'INPUT') {
      if(document.activeElement.id !== 'memberInput') input.focus();
    }
  });
</script>
</body>
</html>
