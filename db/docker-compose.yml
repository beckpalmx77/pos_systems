services:
  # 1. ฐานข้อมูล (Postgres 11)
  kong-database:
    image: postgres:11
    restart: always             # <--- เพิ่ม: ให้รันอัตโนมัติเมื่อเปิดเครื่อง
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kongpass
    ports:
      - "5433:5432"
    networks:
      - kong-net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Migration (ตัวนี้ไม่ต้องใส่ restart always เพราะรันครั้งเดียวแล้วจบ)
  kong-migration:
    image: kong:latest
    command: "kong migrations bootstrap"
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kongpass
    depends_on:
      kong-database:
        condition: service_healthy
    networks:
      - kong-net

  # 3. KONG Gateway
  kong:
    image: kong:latest
    restart: always             # <--- เพิ่ม: ให้รันอัตโนมัติเมื่อเปิดเครื่อง
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kongpass
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_URL: http://192.168.88.241:8002
      KONG_ADMIN_GUI_API_URL: http://192.168.88.241:8001
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
    depends_on:
      kong-migration:
        condition: service_completed_successfully
    networks:
      - kong-net

  # 4. KONGA (Admin Dashboard)
  konga:
    image: pantsel/konga:latest
    restart: always             # <--- เพิ่ม: ให้รันอัตโนมัติเมื่อเปิดเครื่อง
    ports:
      - "1337:1337"
    environment:
      NODE_ENV: production
      DB_ADAPTER: postgres
      DB_HOST: kong-database
      DB_PORT: 5432
      DB_USER: kong
      DB_PASSWORD: kongpass
      DB_DATABASE: konga_db
    depends_on:
      - kong
      - kong-database
    networks:
      - kong-net

networks:
  kong-net:
    driver: bridge
